name: ingest-ping

# Free 15-minute pinger so the quota-aware scheduler ticks more often than
# Vercel Hobby's once-a-day cron. Each tick is resumable and time-budgeted.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ingest tick
        run: |
          curl -sf --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/ingest"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Ping tag tick
        run: |
          curl -sf --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/tag"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}